[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "control-plane"
version = "0.1.0"
description = "AI Agent Desktop Local Control Plane with readiness and isolated cc-connect installation."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "AI Agent Desktop" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "sse-starlette>=2.1",
    "psutil>=6.0",
    "packaging>=24",
    "platformdirs>=4.3",
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "keyring>=25",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
    "jsonschema>=4.23",
    "openapi-spec-validator>=0.7",
]

[project.scripts]
control-plane-serve = "control_plane.main:main"

[tool.setuptools.packages.find]
include = ["control_plane*"]

[tool.setuptools.package-data]
"control_plane.installer" = ["artifact-lock.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# 公开源码目录名不是已安装包名,这里显式映射包根,避免收集失败
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "UP042"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
warn_unused_ignores = true
