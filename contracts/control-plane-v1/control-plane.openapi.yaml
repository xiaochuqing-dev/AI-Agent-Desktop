openapi: 3.1.0
info:
  title: AI Agent Desktop Local Control Plane API
  version: 1.0.0
  summary: Stable local management contract for the desktop GUI and trusted clients.
  description: |
    The read-only foundation, cc-connect Windows AMD64 isolated installation,
    product-owned native configuration revisions, Windows credential references,
    explicit lifecycle ownership, Telegram three-bot identity and binding flows,
    and managed process lifecycle are implemented. Real Telegram validation and
    Windows 10 user-machine validation remain pending. Provider-specific
    structures remain behind Adapter and Renderer boundaries.
  license:
    name: See repository LICENSE
    identifier: Apache-2.0
  x-contract-status: frozen
  x-implementation-status: telegram-native-config-implemented-live-validation-pending
  x-event-types:
    - com.aiagentdesktop.component.state.changed.v1
    - com.aiagentdesktop.component.discovered.v1
    - com.aiagentdesktop.provider.state.changed.v1
    - com.aiagentdesktop.registry.changed.v1
    - com.aiagentdesktop.operation.started.v1
    - com.aiagentdesktop.operation.progress.v1
    - com.aiagentdesktop.operation.completed.v1
    - com.aiagentdesktop.operation.failed.v1
    - com.aiagentdesktop.operation.cancel_requested.v1
    - com.aiagentdesktop.scan.progress.v1
    - com.aiagentdesktop.plan.generated.v1
    - com.aiagentdesktop.diagnostic.created.v1
    - com.aiagentdesktop.task.state.changed.v1
    - com.aiagentdesktop.log.appended.v1
servers:
  - url: http://127.0.0.1:{port}/api/v1
    description: Endpoint discovered from the current-user protected service record.
    variables:
      port:
        default: "58080"
        description: Illustrative only; the default allocation remains a draft implementation decision.
security:
  - localBearer: []
tags:
  - name: System
    description: Control Plane instance and contract negotiation.
  - name: Discovery
    description: Read-only discovery of approved local components and dependencies.
  - name: Components
    description: Component state, lifecycle, and health operations.
  - name: Configuration
    description: Redacted configuration, authentication, and single-writer ownership.
  - name: Credentials
    description: Secret storage boundaries that never return plaintext values.
  - name: Telegram
    description: Three fixed bot identities, explicit binding sessions, webhook safety, and update-stream ownership.
  - name: Observability
    description: Six independent Telegram link states, explicit one-shot live E2E evidence, and session-isolation probes.
  - name: Native Configuration
    description: Locked-version cc-connect rendering and non-writing Hermes configuration plans.
  - name: Agents
    description: First-class Agent and Capability Registry queries.
  - name: Channels
    description: Provider-neutral Channel discovery and connection management.
  - name: Diagnostics
    description: Allowlisted, redacted diagnostics and logs.
  - name: Maintenance
    description: Update, backup, rollback, and migration operations.
  - name: Tasks
    description: Task inspection and human control receipts.
  - name: Operations
    description: Durable long-running control operations and cancellation requests.
  - name: Events
    description: Authenticated Server-Sent Events with replay cursors.
paths:
  /system:
    get:
      tags: [System]
      operationId: getSystem
      summary: Read the Control Plane instance and contract versions.
      x-stability: stable
      responses:
        "200":
          description: Current instance information.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "./core-models.schema.json#/$defs/SystemInfo"
        default:
          $ref: "#/components/responses/Problem"
  /system/capabilities:
    get:
      tags: [System]
      operationId: listSystemCapabilities
      summary: Negotiate API and Provider capabilities before enabling client actions.
      x-stability: stable
      responses:
        "200":
          description: Capability snapshot.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "./core-models.schema.json#/$defs/Capability"
        default:
          $ref: "#/components/responses/Problem"
  "/discovery:run":
    post:
      tags: [Discovery]
      operationId: runDiscovery
      summary: Start a read-only discovery of approved local components and dependencies.
      x-stability: stable
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscoveryRequest"
      responses:
        "202":
          $ref: "#/components/responses/OperationAccepted"
        default:
          $ref: "#/components/responses/Problem"
  /readiness:
    get:
      tags: [Discovery]
      operationId: getReadinessReport
      summary: Read the latest readiness report and dry-run plan from the most recent scan.
      description: The report aggregates system, component, diagnostic, and dry-run plan data. It never contains secrets and asserts that the scan did not modify the system.
      x-stability: stable
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Latest readiness report.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            X-Resource-Version:
              $ref: "#/components/headers/ResourceVersion"
          content:
            application/json:
              schema:
                $ref: "./core-models.schema.json#/$defs/ReadinessReport"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /components:
    get:
      tags: [Components]
      operationId: listComponents
      summary: Read the latest component and orthogonal state snapshot.
      x-stability: stable
      parameters:
        - $ref: "#/components/parameters/ObservedAfter"
      responses:
        "200":
          description: Component snapshot. An empty list is valid.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            X-Resource-Version:
              $ref: "#/components/headers/ResourceVersion"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "./core-models.schema.json#/$defs/Component"
        default:
          $ref: "#/components/responses/Problem"
  "/components/{componentId}":
    parameters:
      - $ref: "#/components/parameters/ComponentId"
    get:
      tags: [Components]
      operationId: getComponent
      summary: Read one component, its version, state, and conditions.
      x-stability: stable
      responses:
        "200":
          description: Component snapshot.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "./core-models.schema.json#/$defs/Component"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  "/components/{componentId}:install":
    parameters:
      - $ref: "#/components/parameters/ComponentId"
    post:
      tags: [Components]
      operationId: installComponent
      summary: Install or repair one component after preflight.
      x-stability: stable
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstallRequest"
      responses:
        "202":
          $ref: "#/components/responses/OperationAccepted"
        default:
          $ref: "#/components/responses/Problem"
  "/components/{componentId}/install-plan":
    parameters:
      - $ref: "#/components/parameters/ComponentId"
    post:
      tags: [Components]
      operationId: createComponentInstallPlan
      summary: Create an immutable cc-connect installation plan without installing.
      x-stability: stable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstallPlanRequest"
      responses:
        "201":
          description: Persisted plan waiting for explicit confirmation.
          content:
            application/json:
              schema:
                $ref: "./core-models.schema.json#/$defs/InstallPlan"
        default:
          $ref: "#/components/responses/Problem"
  "/components/{componentId}/install-plans/{planId}":
    parameters:
      - $ref: "#/components/parameters/ComponentId"
      - name: planId
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Id"
    get:
      tags: [Components]
      operationId: getComponentInstallPlan
      summary: Read one persisted immutable installation plan.
      x-stability: stable
      responses:
        "200":
          description: Installation plan.
          content:
            application/json:
              schema:
                $ref: "./core-models.schema.json#/$defs/InstallPlan"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  "/components/{componentId}:uninstall":
    parameters:
      - $ref: "#/components/parameters/ComponentId"
    post:
      tags: [Components]
      operationId: uninstallManagedComponentVersion
      summary: Uninstall one non-current product-managed cc-connect version.
      x-stability: stable
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UninstallComponentRequest"
      responses:
        "202":
          $ref: "#/components/responses/OperationAccepted"
        default:
          $ref: "#/components/responses/Problem"
  "/components/{componentId}:restore":
    parameters:
      - $ref: "#/components/parameters/ComponentId"
    post:
      tags: [Components]
      operationId: restoreManagedComponentVersion
      summary: Restore the selected or previous product-managed cc-connect version.
      x-stability: stable
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComponentRestoreRequest"
      responses:
        "202":
          $ref: "#/components/responses/OperationAccepted"
        default:
          $ref: "#/components/responses/Problem"
  "/components/{componentId}/managed-versions":
    parameters:
      - $ref: "#/components/parameters/ComponentId"
    get:
      tags: [Components]
      operationId: listManagedComponentVersions
      summary: List product-managed cc-connect versions and current status.
      x-stability: stable
      responses:
        "200":
          description: Product-managed versions only.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "./core-models.schema.json#/$defs/ManagedVersion"
        default:
          $ref: "#/components/responses/Problem"
  "/components/{componentId}/configuration-plans":
    parameters:
      - $ref: "#/components/parameters/ComponentId"
    post:
      tags: [Configuration]
      operationId: createManagedConfigurationPlan
      summary: Create an immutable non-secret product configuration plan.
      x-stability: stable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                listen_port: { type: [integer, "null"], minimum: 59000, maximum: 59999 }
                expires_in_seconds: { type: integer, minimum: 60, maximum: 3600, default: 900 }
                rollback_to_revision: { type: [integer, "null"], minimum: 1 }
      responses:
        "201":
          description: Persisted plan waiting for explicit confirmation.
          content:
            application/json:
              schema:
                $ref: "./managed-runtime.schema.json#/$defs/ConfigurationPlan"
        default:
          $ref: "#/components/responses/Problem"
  "/components/{componentId}/configuration-plans/{planId}":
    parameters:
      - $ref: "#/components/parameters/ComponentId"
      - name: planId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/Id" }
    get:
      tags: [Configuration]
      operationId: getManagedConfigurationPlan
      summary: Read one immutable managed configuration plan.
      responses:
        "200":
          description: Managed configuration plan.
          content:
            application/json:
              schema:
                $ref: "./managed-runtime.schema.json#/$defs/ConfigurationPlan"
        default:
          $ref: "#/components/responses/Problem"
  "/components/{componentId}/configuration:apply":
    parameters:
      - $ref: "#/components/parameters/ComponentId"
    post:
      tags: [Configuration]
      operationId: applyManagedConfigurationPlan
      summary: Confirm and atomically apply an immutable configuration plan.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [plan_id, plan_digest, current_revision, target_revision, confirmation]
              properties:
                plan_id: { type: string }
                plan_digest: { type: string, pattern: "^sha256:[a-f0-9]{64}$" }
                current_revision: { type: integer, minimum: 0 }
                target_revision: { type: integer, minimum: 1 }
                confirmation: { const: true }
      responses:
        "202": { $ref: "#/components/responses/OperationAccepted" }
        default: { $ref: "#/components/responses/Problem" }
  "/components/{componentId}/ownership-plans":
    parameters:
      - $ref: "#/components/parameters/ComponentId"
    post:
      tags: [Configuration]
      operationId: createLifecycleOwnershipPlan
      summary: Create a separate explicit product lifecycle ownership handoff plan.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                target_lifecycle_owner: { const: product }
                expires_in_seconds: { type: integer, minimum: 60, maximum: 3600, default: 900 }
      responses:
        "201":
          description: Ownership handoff plan.
          content:
            application/json:
              schema: { $ref: "./managed-runtime.schema.json#/$defs/OwnershipPlan" }
        default: { $ref: "#/components/responses/Problem" }
  "/components/{componentId}/ownership-plans/{planId}":
    parameters:
      - $ref: "#/components/parameters/ComponentId"
      - name: planId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/Id" }
    get:
      tags: [Configuration]
      operationId: getLifecycleOwnershipPlan
      responses:
        "200":
          description: Ownership handoff plan.
          content:
            application/json:
              schema: { $ref: "./managed-runtime.schema.json#/$defs/OwnershipPlan" }
        default: { $ref: "#/components/responses/Problem" }
  "/components/{componentId}/ownership:confirm":
    parameters:
      - $ref: "#/components/parameters/ComponentId"
    post:
      tags: [Configuration]
      operationId: confirmLifecycleOwnershipPlan
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [plan_id, plan_digest, current_management_owner, current_lifecycle_owner, confirmation]
              properties:
                plan_id: { type: string }
                plan_digest: { type: string, pattern: "^sha256:[a-f0-9]{64}$" }
                current_management_owner: { type: string, enum: [external, product, unmanaged, conflict, unknown] }
                current_lifecycle_owner: { type: string, enum: [external, product, none, conflict, unknown] }
                confirmation: { const: true }
      responses:
        "202": { $ref: "#/components/responses/OperationAccepted" }
        default: { $ref: "#/components/responses/Problem" }
  "/components/{componentId}/lifecycle":
    parameters:
      - $ref: "#/components/parameters/ComponentId"
    get:
      tags: [Components]
      operationId: getManagedLifecycleStatus
      summary: Probe and read product-managed process, owner, port, and health evidence.
      responses:
        "200":
          description: Managed runtime status. Deep health remains unsupported.
          content:
            application/json:
              schema: { $ref: "./managed-runtime.schema.json#/$defs/LifecycleRuntimeStatus" }
        default: { $ref: "#/components/responses/Problem" }
  "/components/{componentId}:reconcile":
    parameters:
      - $ref: "#/components/parameters/ComponentId"
    post:
      tags: [Components]
      operationId: reconcileManagedLifecycle
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LifecycleRequest" }
      responses:
        "202": { $ref: "#/components/responses/OperationAccepted" }
        default: { $ref: "#/components/responses/Problem" }
  "/components/{componentId}/process-identity":
    parameters:
      - $ref: "#/components/parameters/ComponentId"
    get:
      tags: [Components]
      operationId: getManagedProcessIdentity
      responses:
        "200":
          description: Recorded identity and current verification result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  identity:
                    oneOf:
                      - { $ref: "./managed-runtime.schema.json#/$defs/ProcessIdentity" }
                      - { type: "null" }
                  verification: { type: [object, "null"] }
        default: { $ref: "#/components/responses/Problem" }
  "/components/{componentId}/port-ownership":
    parameters:
      - $ref: "#/components/parameters/ComponentId"
    get:
      tags: [Components]
      operationId: getManagedPortOwnership
      responses:
        "200":
          description: Exact TCP port-to-PID evidence, or null when not applicable.
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "./managed-runtime.schema.json#/$defs/PortOwnershipEvidence" }
                  - { type: "null" }
        default: { $ref: "#/components/responses/Problem" }
  "/components/{componentId}/native-configuration/renderer":
    parameters:
      - $ref: "#/components/parameters/ComponentId"
    get:
      tags: [Native Configuration]
      operationId: getNativeConfigurationRendererCapability
      summary: Read the renderer version and locked cc-connect schema capabilities.
      x-stability: stable
      responses:
        "200":
          description: Renderer bound to the exact locked upstream commit.
          content:
            application/json:
              schema:
                $ref: "./managed-runtime.schema.json#/$defs/NativeRendererCapability"
        default:
          $ref: "#/components/responses/Problem"
  "/components/{componentId}/native-configuration-plans":
    parameters:
      - $ref: "#/components/parameters/ComponentId"
    post:
      tags: [Native Configuration]
      operationId: createNativeConfigurationPlan
      summary: Plan separated product state and locked-upstream cc-connect TOML.
      description: A rollback is requested by setting rollback_to_revision; secrets are represented only by credential references and environment variable names.
      x-stability: stable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NativeConfigurationPlanRequest"
      responses:
        "201":
          description: Immutable native configuration plan awaiting explicit confirmation.
          content:
            application/json:
              schema:
                $ref: "./managed-runtime.schema.json#/$defs/NativeConfigurationPlan"
        default:
          $ref: "#/components/responses/Problem"
  "/components/{componentId}/native-configuration-plans/{planId}":
    parameters:
      - $ref: "#/components/parameters/ComponentId"
      - name: planId
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Id"
    get:
      tags: [Native Configuration]
      operationId: getNativeConfigurationPlan
      summary: Read one immutable native configuration or rollback plan.
      x-stability: stable
      responses:
        "200":
          description: Native configuration plan.
          content:
            application/json:
              schema:
                $ref: "./managed-runtime.schema.json#/$defs/NativeConfigurationPlan"
        default:
          $ref: "#/components/responses/Problem"
  "/components/{componentId}/native-configuration:apply":
    parameters:
      - $ref: "#/components/parameters/ComponentId"
    post:
      tags: [Native Configuration]
      operationId: applyNativeConfigurationPlan
      summary: Confirm and atomically apply or roll back separated native configuration state.
      x-stability: stable
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NativeConfigurationConfirmation"
      responses:
        "202":
          $ref: "#/components/responses/OperationAccepted"
        default:
          $ref: "#/components/responses/Problem"
  "/components/{componentId}/native-configuration":
    parameters:
      - $ref: "#/components/parameters/ComponentId"
    get:
      tags: [Native Configuration]
      operationId: getNativeConfigurationState
      summary: Read native TOML and product-state revisions, digests, and drift status without secrets.
      x-stability: stable
      responses:
        "200":
          description: Current separated native configuration state.
          content:
            application/json:
              schema:
                $ref: "./managed-runtime.schema.json#/$defs/NativeConfigurationState"
        default:
          $ref: "#/components/responses/Problem"
  "/components/{componentId}/external-cc-connect":
    parameters:
      - $ref: "#/components/parameters/ComponentId"
    get:
      tags: [Native Configuration]
      operationId: getExternalCcConnectDetection
      summary: Detect external installation, process, port, configuration, supervisor, owner, conflict, and unknown evidence.
      description: Installation on PATH alone never creates a conflict and this endpoint never changes external state.
      x-stability: stable
      responses:
        "200":
          description: Read-only external cc-connect evidence.
          content:
            application/json:
              schema:
                $ref: "./managed-runtime.schema.json#/$defs/ExternalCcConnectState"
        default:
          $ref: "#/components/responses/Problem"
  /components/hermes/telegram-configuration-plans:
    post:
      tags: [Native Configuration]
      operationId: createHermesTelegramConfigurationPlan
      summary: Generate a non-writing Hermes Telegram plan or an accurate pending-install status.
      description: Existing Hermes configuration ownership remains external; this endpoint never installs, upgrades, or rewrites Hermes.
      x-stability: stable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HermesConfigurationPlanRequest"
      responses:
        "201":
          description: External-owner plan or pending_component_install result.
          content:
            application/json:
              schema:
                $ref: "./managed-runtime.schema.json#/$defs/HermesConfigurationPlan"
        default:
          $ref: "#/components/responses/Problem"
  /components/hermes/telegram-configuration:
    get:
      tags: [Native Configuration]
      operationId: getHermesTelegramConfigurationState
      summary: Read the latest non-writing Hermes Telegram configuration plan state.
      x-stability: stable
      responses:
        "200":
          description: Latest plan or missing_plan.
          content:
            application/json:
              schema:
                $ref: "./managed-runtime.schema.json#/$defs/HermesConfigurationState"
        default:
          $ref: "#/components/responses/Problem"
  "/components/{componentId}:start":
    parameters:
      - $ref: "#/components/parameters/ComponentId"
    post:
      tags: [Components]
      operationId: startComponent
      summary: Request the running target state.
      x-stability: stable
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LifecycleRequest"
      responses:
        "202":
          $ref: "#/components/responses/OperationAccepted"
        default:
          $ref: "#/components/responses/Problem"
  "/components/{componentId}:stop":
    parameters:
      - $ref: "#/components/parameters/ComponentId"
    post:
      tags: [Components]
      operationId: stopComponent
      summary: Request the stopped target state.
      x-stability: stable
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LifecycleRequest"
      responses:
        "202":
          $ref: "#/components/responses/OperationAccepted"
        default:
          $ref: "#/components/responses/Problem"
  "/components/{componentId}:restart":
    parameters:
      - $ref: "#/components/parameters/ComponentId"
    post:
      tags: [Components]
      operationId: restartComponent
      summary: Perform one serialized restart operation.
      x-stability: stable
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LifecycleRequest"
      responses:
        "202":
          $ref: "#/components/responses/OperationAccepted"
        default:
          $ref: "#/components/responses/Problem"
  "/components/{componentId}/health:check":
    parameters:
      - $ref: "#/components/parameters/ComponentId"
    post:
      tags: [Components]
      operationId: checkComponentHealth
      summary: Run an explicitly scoped health check.
      description: The default check is read-only. A deep check that can produce external effects requires explicit confirmation.
      x-stability: stable
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HealthCheckRequest"
      responses:
        "202":
          $ref: "#/components/responses/OperationAccepted"
        default:
          $ref: "#/components/responses/Problem"
  "/components/{componentId}/configuration":
    parameters:
      - $ref: "#/components/parameters/ComponentId"
    get:
