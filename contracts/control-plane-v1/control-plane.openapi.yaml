          $ref: "#/components/responses/OperationAccepted"
        default:
          $ref: "#/components/responses/Problem"
  "/components/{componentId}:rollback":
    parameters:
      - $ref: "#/components/parameters/ComponentId"
    post:
      tags: [Maintenance]
      operationId: rollbackComponent
      summary: Roll back one component to a verified backup.
      x-stability: stable
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RollbackRequest"
      responses:
        "202":
          $ref: "#/components/responses/OperationAccepted"
        default:
          $ref: "#/components/responses/Problem"
  /backups:
    get:
      tags: [Maintenance]
      operationId: listBackups
      summary: List available backup and rollback points.
      x-stability: stable
      responses:
        "200":
          description: Backup snapshot.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "./core-models.schema.json#/$defs/Backup"
        default:
          $ref: "#/components/responses/Problem"
    post:
      tags: [Maintenance]
      operationId: createBackup
      summary: Create a scoped backup; credentials are excluded unless explicitly requested.
      x-stability: stable
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BackupRequest"
      responses:
        "202":
          $ref: "#/components/responses/OperationAccepted"
        default:
          $ref: "#/components/responses/Problem"
  "/backups/{backupId}:restore":
    parameters:
      - $ref: "#/components/parameters/BackupId"
    post:
      tags: [Maintenance]
      operationId: restoreBackup
      summary: Validate and restore selected backup scopes.
      x-stability: stable
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestoreRequest"
      responses:
        "202":
          $ref: "#/components/responses/OperationAccepted"
        default:
          $ref: "#/components/responses/Problem"
  /migrations:
    post:
      tags: [Maintenance]
      operationId: createMigration
      summary: Export or import an authenticated encrypted migration package.
      x-stability: experimental
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MigrationRequest"
      responses:
        "202":
          $ref: "#/components/responses/OperationAccepted"
        default:
          $ref: "#/components/responses/Problem"
  /tasks:
    get:
      tags: [Tasks]
      operationId: listTasks
      summary: List orchestration tasks without message transcripts.
      x-stability: stable
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: status
          in: query
          schema:
            type: string
            enum: [queued, running, pausing, paused, cancel_requested, canceled, succeeded, failed]
      responses:
        "200":
          description: Task page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskPage"
        default:
          $ref: "#/components/responses/Problem"
  "/tasks/{taskId}":
    parameters:
      - $ref: "#/components/parameters/TaskId"
    get:
      tags: [Tasks]
      operationId: getTask
      summary: Read a task and its control revision.
      x-stability: stable
      responses:
        "200":
          description: Task snapshot.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "./core-models.schema.json#/$defs/Task"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  "/tasks/{taskId}/interventions":
    parameters:
      - $ref: "#/components/parameters/TaskId"
    post:
      tags: [Tasks]
      operationId: createTaskIntervention
      summary: Submit a human pause, resume, cancel, intervention, or reassignment.
      x-stability: experimental
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HumanInterventionRequest"
      responses:
        "202":
          description: Control request accepted; acceptance does not prove that the Provider has applied it.
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterventionAccepted"
        "409":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /operations:
    get:
      tags: [Operations]
      operationId: listOperations
      summary: List persisted Control Plane operations.
      x-stability: stable
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: status
          in: query
          schema:
            type: string
            enum: [queued, running, cancel_requested, succeeded, failed, canceled]
        - name: kind
          in: query
          schema:
            type: string
            maxLength: 128
        - name: target_id
          in: query
          schema:
            $ref: "#/components/schemas/Id"
      responses:
        "200":
          description: Operation page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationPage"
        default:
          $ref: "#/components/responses/Problem"
  "/operations/{operationId}":
    parameters:
      - $ref: "#/components/parameters/OperationId"
    get:
      tags: [Operations]
      operationId: getOperation
      summary: Read current progress and the mutually exclusive result or error.
      x-stability: stable
      responses:
        "200":
          description: Operation snapshot.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "./core-models.schema.json#/$defs/Operation"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  "/operations/{operationId}:cancel":
    parameters:
      - $ref: "#/components/parameters/OperationId"
    post:
      tags: [Operations]
      operationId: cancelOperation
      summary: Request cancellation without claiming the target has terminated.
      x-stability: stable
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelRequest"
      responses:
        "202":
          $ref: "#/components/responses/OperationAccepted"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  "/operations/{operationId}/events":
    parameters:
      - $ref: "#/components/parameters/OperationId"
    get:
      tags: [Operations]
      operationId: listOperationAuditEvents
      summary: Read durable audit and progress events for one operation.
      x-stability: stable
      responses:
        "200":
          description: Ordered durable operation events.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "./core-models.schema.json#/$defs/OperationAuditEvent"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /external-tools/cc-switch:
    get:
      tags: [Maintenance]
      operationId: getCcSwitchExternalToolStatus
      summary: Detect CC Switch and disclose only verified external capabilities.
      responses:
        "200":
          description: CC Switch detection and capability evidence.
          content:
            application/json:
              schema: { $ref: "./managed-runtime.schema.json#/$defs/ExternalToolStatus" }
        default: { $ref: "#/components/responses/Problem" }
  "/external-tools/cc-switch:launch":
    post:
      tags: [Maintenance]
      operationId: launchCcSwitchExternalTool
      summary: Open a detected CC Switch executable without GUI automation or configuration writes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [confirmation]
              properties:
                confirmation: { const: true }
      responses:
        "200":
          description: Normal launch receipt; it never claims install, update, or configuration success.
          content:
            application/json:
              schema: { type: object }
        default: { $ref: "#/components/responses/Problem" }
  /components/cc-connect/update-assessment:
    get:
      tags: [Maintenance]
      operationId: assessLockedCcConnectUpdate
      summary: Assess an exact locked target without performing an update.
      parameters:
        - name: requested_version
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      responses:
        "200":
          description: Read-only update assessment.
          content:
            application/json:
              schema: { $ref: "./managed-runtime.schema.json#/$defs/UpdateAssessment" }
        default: { $ref: "#/components/responses/Problem" }
  /components/hermes/update-assessment:
    get:
      tags: [Maintenance]
      operationId: assessHermesUpdateBoundary
      summary: Return unsupported until a verified Hermes update Adapter exists.
      parameters:
        - name: requested_version
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      responses:
        "200":
          description: Explicit unsupported assessment; no Hermes action occurs.
          content:
            application/json:
              schema: { $ref: "./managed-runtime.schema.json#/$defs/UpdateAssessment" }
        default: { $ref: "#/components/responses/Problem" }
  /events:
    get:
      tags: [Events]
      operationId: subscribeEvents
      summary: Subscribe to an authenticated, at-least-once SSE stream.
      description: Use Last-Event-ID to resume. A 410 response requires a fresh resource snapshot before resubscribing without a cursor.
      x-stability: stable
      parameters:
        - name: topics
          in: query
          description: Optional comma-separated stable event type prefixes. It never contains credentials.
          schema:
            type: string
            maxLength: 1024
        - name: Last-Event-ID
          in: header
          required: false
          schema:
            type: string
            pattern: "^[A-Za-z0-9._:-]+:[1-9][0-9]*$"
      responses:
        "200":
          description: SSE records whose data field validates against event-envelope.schema.json.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            text/event-stream:
              schema:
                type: string
        "410":
          description: EVENT_CURSOR_EXPIRED. Fetch resource snapshots and then create a new subscription.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /observability/links:
    get:
      tags: [Observability]
      operationId: listObservabilityLinks
      summary: List the six independent Telegram link states.
      responses:
        "200":
          description: Redacted link snapshots; process state alone never implies a healthy message path.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LinkState"
        default: { $ref: "#/components/responses/Problem" }
  /observability/links/{linkId}:
    get:
      tags: [Observability]
      operationId: getObservabilityLink
      summary: Read one independent Telegram link state.
      parameters:
        - name: linkId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/LinkId" }
      responses:
        "200":
          description: Redacted link snapshot.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LinkState" }
        default: { $ref: "#/components/responses/Problem" }
  /observability/links/{linkId}/e2e-plans:
    post:
      tags: [Observability]
      operationId: createObservabilityE2EPlan
      summary: Create an immutable, un-sent one-shot E2E plan.
      description: Creating a plan never contacts Telegram. Confirmation is required before exactly one message can be sent.
      parameters:
        - name: linkId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/LinkId" }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/E2EPlanCreateRequest" }
      responses:
        "201":
          description: Immutable plan with a digest and expected revisions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/E2ETestPlan" }
        default: { $ref: "#/components/responses/Problem" }
  /observability/e2e-plans/{planId}:
    get:
      tags: [Observability]
      operationId: getObservabilityE2EPlan
      summary: Read an immutable E2E plan and its lifecycle status.
      parameters:
        - name: planId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/Id" }
      responses:
        "200":
          description: E2E plan metadata only; no payload body is returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/E2ETestPlan" }
        default: { $ref: "#/components/responses/Problem" }
  /observability/e2e-plans/{planId}:confirm:
    post:
      tags: [Observability]
      operationId: confirmObservabilityE2EPlan
      summary: Explicitly consume one plan and send at most one acceptance message.
      description: The Idempotency-Key and the plan's unique database claim prevent retries, duplicate sends, and cross-link sends.
      parameters:
        - name: planId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/Id" }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/E2ETestConfirmation" }
      responses:
        "200":
          description: Redacted send and response evidence summary. A pending response is not a failure retry signal.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/E2ETestRun" }
        default: { $ref: "#/components/responses/Problem" }
  /observability/e2e-plans/{planId}:cancel:
    post:
      tags: [Observability]
      operationId: cancelObservabilityE2EPlan
      summary: Cancel an unconsumed plan.
      parameters:
        - name: planId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/Id" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/E2EPlanCancelRequest" }
      responses:
        "200":
          description: Canceled plan.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/E2ETestPlan" }
        default: { $ref: "#/components/responses/Problem" }
  /observability/e2e-runs:
    get:
      tags: [Observability]
      operationId: listObservabilityE2ERuns
      summary: List redacted E2E run summaries.
      responses:
        "200":
          description: Message identifiers and evidence levels only; complete message bodies are never stored.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/E2ETestRun"
        default: { $ref: "#/components/responses/Problem" }
  /observability/e2e-runs/{runId}/response:
    post:
      tags: [Observability]
      operationId: recordObservabilityE2EResponse
      summary: Record exact response identifiers supplied by the owning runtime.
      description: Control Plane does not poll Telegram. Evidence is accepted only when bot, chat hash, reply-to, and message timing match the request.
      parameters:
        - name: runId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/Id" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/E2ETestResponseEvidence" }
      responses:
        "200":
          description: Updated evidence summary, or an ambiguous/duplicate result without promotion.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/E2ETestRun" }
        default: { $ref: "#/components/responses/Problem" }
  /observability/synthetic-e2e:run:
    post:
      tags: [Observability]
      operationId: runSyntheticObservabilityE2E
      summary: Run six deterministic offline E2E fixtures.
      description: Synthetic fixtures never contact Telegram and can only produce synthetic evidence.
      responses:
        "200":
          description: Six synthetic run summaries.
          content:
            application/json:
              schema:
                type: array
                minItems: 6
                maxItems: 6
                items:
                  $ref: "#/components/schemas/E2ETestRun"
        default: { $ref: "#/components/responses/Problem" }
  /observability/session-isolation:probe:
    post:
      tags: [Observability]
      operationId: runSessionIsolationProbe
      summary: Run the offline session-isolation matrix.
      description: The probe covers private/group, bot, user/group/topic, reply/mention, command, restart, offset, duplicate, and no-retry boundaries.
      responses:
        "200":
          description: Synthetic isolation result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionIsolationResult" }
        default: { $ref: "#/components/responses/Problem" }
  /observability/session-isolation:
    get:
      tags: [Observability]
      operationId: getLatestSessionIsolationProbe
      summary: Read the latest isolation probe result.
      responses:
        "200":
          description: Latest result, or null before the first probe.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/SessionIsolationResult"
                  - type: "null"
        default: { $ref: "#/components/responses/Problem" }
  /telegram/network-policy:
    get:
      tags: [Telegram]
      operationId: getTelegramNetworkPolicy
      summary: Read the effective Telegram proxy policy without credentials.
      description: The policy is direct, environment, or explicit. Proxy passwords and inline credentials are never returned.
      responses:
        "200":
          description: Redacted policy state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProxyPolicyState" }
        default: { $ref: "#/components/responses/Problem" }
components:
  securitySchemes:
    localBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque-local-token
      description: At least 256 bits of entropy. Supplied only in the Authorization header.
  headers:
    ETag:
      description: Opaque resource revision for optimistic concurrency.
      schema:
        type: string
    ResourceVersion:
      description: Opaque version for a consistent collection snapshot.
      schema:
        type: string
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Reusing a key with a different normalized request returns IDEMPOTENCY_KEY_REUSE.
      schema:
        type: string
        minLength: 16
        maxLength: 256
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      schema:
        $ref: "#/components/schemas/Id"
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Opaque expected revision. A stale value returns REVISION_CONFLICT.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    ComponentId:
      name: componentId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Id"
    CredentialId:
      name: credentialId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Id"
    TelegramSlot:
      name: slot
      in: path
      required: true
      schema:
        type: string
        enum: [hermes, claude, codex]
    TelegramBindingSessionId:
      name: sessionId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Id"
    AgentId:
      name: agentId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Id"
    ChannelId:
      name: channelId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Id"
    DiagnosticId:
      name: diagnosticId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Id"
    BackupId:
      name: backupId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Id"
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Id"
    OperationId:
      name: operationId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Id"
    ScopeIdQuery:
      name: scope_id
      in: query
      required: true
      schema:
        $ref: "#/components/schemas/Id"
    ObservedAfter:
      name: observed_after
      in: query
      required: false
      description: Return snapshots observed after this RFC 3339 timestamp when supported.
      schema:
        type: string
        format: date-time
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        maxLength: 512
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
  responses:
    OperationAccepted:
      description: Operation accepted. This does not prove that an external side effect has completed.
      headers:
        Location:
          description: Relative Operation resource URL.
          schema:
            type: string
        Retry-After:
          description: Suggested minimum polling interval in seconds when SSE is unavailable.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "./core-models.schema.json#/$defs/Operation"
    Problem:
      description: RFC 9457 compatible, user-facing and redacted problem details.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Id:
      type: string
      minLength: 1
      maxLength: 128
      pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]*$"
    LinkId:
      type: string
      enum: [hermes.private, hermes.group, claude.private, claude.group, codex.private, codex.group]
    LinkStatus:
      type: string
      enum: [unknown, not_configured, credential_missing, identity_unverified, binding_pending, runtime_stopped, runtime_conflict, ready_for_live_test, live_test_running, healthy, degraded, failed, unsupported, pending_user_validation]
    EvidenceLevel:
      type: string
      enum: [inferred, synthetic, observed, live_verified]
    TestLifecycle:
      type: string
      enum: [planned, confirmed, running, succeeded, failed, unknown, canceled, expired]
    LinkState:
      type: object
      additionalProperties: false
      required: [link_id, bot_slot, session_scope]
      properties:
        link_id: { $ref: "#/components/schemas/LinkId" }
        bot_slot:
          type: string
          enum: [hermes, claude, codex]
        session_scope:
          type: string
          enum: [private, group]
        bot_id:
          anyOf: [{ type: integer, exclusiveMinimum: 0 }, { type: "null" }]
        bot_username:
          anyOf: [{ type: string }, { type: "null" }]
        credential_reference_id:
          anyOf: [{ type: string }, { type: "null" }]
        credential_revision: { type: integer, minimum: 0, default: 0 }
        binding_session_id:
          anyOf: [{ type: string }, { type: "null" }]
        binding_revision: { type: integer, minimum: 0, default: 0 }
        operator_identity_hash:
          anyOf: [{ type: string }, { type: "null" }]
        group_identity_hash:
          anyOf: [{ type: string }, { type: "null" }]
        runtime_owner: { type: string, default: unknown }
        runtime_state: { type: string, default: unknown }
        configuration_revision: { type: integer, minimum: 0, default: 0 }
        update_lease_owner: { type: string, default: unknown }
        send_status: { type: string, default: unknown }
        receive_status: { type: string, default: unknown }
        response_status: { type: string, default: unknown }
        correlation_id:
          anyOf: [{ type: string }, { type: "null" }]
        request_message_id:
          anyOf: [{ type: integer, minimum: 0 }, { type: "null" }]
        response_message_id:
          anyOf: [{ type: integer, minimum: 0 }, { type: "null" }]
        latency_ms:
          anyOf: [{ type: integer, minimum: 0 }, { type: "null" }]
        evidence_level:
          $ref: "#/components/schemas/EvidenceLevel"
        status:
          $ref: "#/components/schemas/LinkStatus"
        diagnostic_code:
          anyOf: [{ type: string }, { type: "null" }]
