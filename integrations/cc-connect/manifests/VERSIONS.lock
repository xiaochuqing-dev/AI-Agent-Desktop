# cc-connect 构建参数（build 脚本读取本节）
[cc-connect-build]
go_version = "go1.26.5 windows/amd64"
build_tags = "no_web goolm no_pi"
# tags 说明:
#   no_web - 跳过 web admin 前端 embed (web/embed.go 的 //go:embed all:dist 需 dist 目录)
#   goolm  - 用 goolm olm 库 (默认)
#   no_pi  - 排除 pi agent (cmd/cc-connect/plugin_agent_pi.go)
ldflags_template = "-s -w -X main.version={VERSION} -X main.commit={SHORTSHA} -X main.buildTime={BUILDTIME}"
# 版本号构成（用户决策：upstream-version + patchset-version + source-short-sha，不沿用旧 v1.3.3）
version_format = "v{npm_package_version}-patchset{patchset_version}-{source_short_sha}"
example_version = "v1.4.1-patchset0.1-fc315d2"
note = "旧运行二进制 ldflags 把 version 写成 v1.3.3 patch-noprefix（人为注入，非真实回退）。新版用明确构成，不复制旧字符串。"

