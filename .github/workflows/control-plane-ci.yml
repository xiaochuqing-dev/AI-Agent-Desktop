name: control-plane-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CC_CONNECT_COMMIT: fc315d213b49d62e9d90ea4a510189d4115e636f
  CC_CONNECT_REPOSITORY: https://github.com/chenhg5/cc-connect.git
  CONTROL_PLANE_DISABLE_LIVE_TELEGRAM: "1"

jobs:
  quality:
    name: Windows-first quality gates
    runs-on: windows-2022
    defaults:
      run:
        working-directory: control-plane
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0

      - name: Set up Python 3.12.10
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: |
            control-plane/pyproject.toml
            control-plane/requirements-build.lock
            control-plane/requirements-dev.lock

      - name: Install locked project dependencies
        run: |
          python -m pip install --require-hashes -r requirements-build.lock
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy type check
        run: mypy control_plane

      - name: Alembic migration tests
        run: pytest tests/test_migrations.py -q

      - name: Unit, integration, failure-matrix, and secret tests
        run: pytest -q

      - name: OpenAPI and JSON Schema validation
        run: python scripts/validate_contracts.py

  ubuntu-compat:
    name: Platform-independent core compatibility
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: control-plane
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0

      - name: Set up Python 3.12.10
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: "3.12.10"

      - name: Install locked project dependencies
        run: |
          python -m pip install --require-hashes -r requirements-build.lock
          python -m pip install --require-hashes -r requirements-dev-linux.lock
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Run platform-independent tests
        run: >-
          pytest -q
          tests/test_contract.py
          tests/test_domain_models.py
          tests/test_event_log.py
          tests/test_installer_artifacts.py
          tests/test_migrations.py
          tests/test_redaction.py

  production-only:
    name: Production dependency and import acceptance
    runs-on: windows-2022
    defaults:
      run:
        working-directory: control-plane
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0

      - name: Set up Python 3.12.10
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: |
            control-plane/requirements-build.lock
            control-plane/requirements-prod.lock

      - name: Install only production dependencies
        run: |
          python -m pip install --require-hashes -r requirements-build.lock
          python -m pip install --require-hashes -r requirements-prod.lock
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Run production-only smoke acceptance
        run: python scripts/production_only_acceptance.py --skip-install

  cc-connect-windows-artifact:
    name: Locked cc-connect Windows artifact and isolated acceptance
    needs: quality
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0

      - name: Set up Go 1.26.5
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.0.0
        with:
          go-version: 1.26.5
          cache: false

      - name: Set up Python 3.12.10
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: "3.12.10"

      - name: Acquire exact upstream commit
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $source = Join-Path $env:RUNNER_TEMP "cc-connect locked source (ci)"
          git init $source
          git -C $source config core.autocrlf false
          git -C $source remote add origin $env:CC_CONNECT_REPOSITORY
          git -C $source fetch --depth=1 origin $env:CC_CONNECT_COMMIT
          git -C $source checkout --detach FETCH_HEAD
          $head = (git -C $source rev-parse HEAD).Trim()
          if ($head -ne $env:CC_CONNECT_COMMIT) { throw "upstream commit mismatch: $head" }
          "CC_CONNECT_SOURCE=$source" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify patches on pristine source with Windows PowerShell 5.1
        shell: powershell
        run: |
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\integrations\cc-connect\scripts\check-cc-connect-patches.ps1" -SourceDir $env:CC_CONNECT_SOURCE

      - name: Apply locked patchset with Windows PowerShell 5.1
        shell: powershell
        run: |
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\integrations\cc-connect\scripts\apply-cc-connect-patches.ps1" -SourceDir $env:CC_CONNECT_SOURCE

      - name: Run related Go tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Push-Location -LiteralPath $env:CC_CONNECT_SOURCE
          try {
            go test -mod=readonly -tags "no_web goolm no_pi" ./core -run 'Test(MessageReceivedExtra|MessageSentDeliveredExtra|RelayManager_(DefaultVisibilityEchoesFullMessages|VisibilitySummarySuppressesBodies|VisibilityNoneSuppressesGroupEcho))$'
            go test -mod=readonly -tags "no_web goolm no_pi" ./platform/telegram -run 'Test(IsDirectedAtBot|SendRecordsMessageID|SendImageRecordsMessageID|SendFileRecordsMessageID|DispatchMessagePopulatesMetadata|DispatchMessageBotSender)$'
          }
          finally {
            Pop-Location
          }

      - name: Build twice with stable inputs
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $first = Join-Path $env:RUNNER_TEMP "cc-connect artifact one (ci)"
          $second = Join-Path $env:RUNNER_TEMP "cc-connect artifact two (ci)"
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\integrations\cc-connect\scripts\build-cc-connect.ps1" -SourceDir $env:CC_CONNECT_SOURCE -OutputDir $first
          pwsh.exe -NoProfile -NonInteractive -File ".\integrations\cc-connect\scripts\build-cc-connect.ps1" -SourceDir $env:CC_CONNECT_SOURCE -OutputDir $second
          $firstHash = (Get-FileHash -LiteralPath (Join-Path $first "cc-connect.exe") -Algorithm SHA256).Hash
          $secondHash = (Get-FileHash -LiteralPath (Join-Path $second "cc-connect.exe") -Algorithm SHA256).Hash
          if ($firstHash -ne $secondHash) { throw "reproducible build SHA256 mismatch" }
          "CC_CONNECT_ARTIFACT=$first" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CC_CONNECT_ARTIFACT_SECOND=$second" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify artifact with Windows PowerShell 5.1
        shell: powershell
        run: |
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\integrations\cc-connect\scripts\verify-cc-connect-artifact.ps1" -BundleDir $env:CC_CONNECT_ARTIFACT

      - name: Verify artifact with PowerShell 7
        shell: pwsh
        run: |
          ./integrations/cc-connect/scripts/verify-cc-connect-artifact.ps1 -BundleDir $env:CC_CONNECT_ARTIFACT_SECOND

      - name: Install Control Plane dependencies
        shell: pwsh
        run: |
          python -m pip install --require-hashes -r ./control-plane/requirements-build.lock
          python -m pip install --require-hashes -r ./control-plane/requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e ./control-plane

      - name: Install locked GUI dependencies
        shell: pwsh
        run: python -m pip install --require-hashes -r ./control-plane/requirements-gui.lock

      - name: Run offscreen GUI smoke tests
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          CONTROL_PLANE_DISABLE_LIVE_TELEGRAM: "1"
        run: |
          python -c "from PySide6.QtWidgets import QApplication; app = QApplication([]); app.processEvents(); print('PySide6 offscreen import passed')"
          python -m pytest -q ./control-plane/tests/test_gui.py

      - name: Verify Windows Credential Manager backend
        shell: pwsh
        run: >-
          python ./control-plane/scripts/windows_credential_manager_acceptance.py
          --output "$env:CC_CONNECT_ARTIFACT/windows-credential-manager-acceptance.json"

      - name: Run real isolated Windows acceptance
        shell: pwsh
        run: >-
          python ./control-plane/scripts/windows_isolated_acceptance.py
          --bundle "$env:CC_CONNECT_ARTIFACT"
          --output "$env:CC_CONNECT_ARTIFACT/windows-isolated-acceptance.json"

      - name: Run managed configuration and lifecycle acceptance
        shell: pwsh
        run: >-
          python ./control-plane/scripts/windows_managed_runtime_acceptance.py
          --bundle "$env:CC_CONNECT_ARTIFACT"
          --output "$env:CC_CONNECT_ARTIFACT/windows-managed-runtime-acceptance.json"

      - name: Run Telegram binding and native runtime acceptance
        shell: pwsh
        run: >-
          python ./control-plane/scripts/windows_native_runtime_acceptance.py
          --bundle "$env:CC_CONNECT_ARTIFACT"
          --output "$env:CC_CONNECT_ARTIFACT/windows-native-runtime-acceptance.json"

      - name: Validate Windows 10 no-development-runtime wrapper with PowerShell 5.1
        shell: powershell
        run: |
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\control-plane\scripts\windows10_user_acceptance.ps1" -OutputPath "$env:CC_CONNECT_ARTIFACT\windows10-user-acceptance-wrapper.json"

      - name: Build formal GUI candidate
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $candidate = Join-Path $env:RUNNER_TEMP "AI-Agent-Desktop GUI candidate"
          $python = (Get-Command python.exe -ErrorAction Stop).Source
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\control-plane\scripts\build_windows_candidate.ps1" `
            -CcConnectBundle $env:CC_CONNECT_ARTIFACT `
            -OutputDir $candidate `
            -Clean `
            -PythonExe $python
          if ($LASTEXITCODE -ne 0) { throw "GUI candidate build failed" }
          "AI_AGENT_DESKTOP_GUI_CANDIDATE=$candidate" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run GUI candidate Windows acceptance wrapper
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $reportPath = Join-Path $env:RUNNER_TEMP "gui-candidate-windows-acceptance.json"
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\control-plane\scripts\windows10_user_acceptance.ps1" `
            -ProductBundle $env:AI_AGENT_DESKTOP_GUI_CANDIDATE `
            -OutputPath $reportPath
          $report = Get-Content -LiteralPath $reportPath -Raw -Encoding UTF8 | ConvertFrom-Json
          if (-not [bool]$report.candidate_smoke_passed) { throw "GUI candidate wrapper smoke failed" }
          if ([bool]$report.real_telegram_access) { throw "GUI candidate wrapper accessed real Telegram" }

      - name: Validate formal GUI candidate
        shell: pwsh
        env:
          CONTROL_PLANE_DISABLE_LIVE_TELEGRAM: "1"
        run: python ./control-plane/scripts/validate_gui_candidate.py --candidate "$env:AI_AGENT_DESKTOP_GUI_CANDIDATE"

      - name: Upload verified GUI candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: ai-agent-desktop-0.2.0-gui-windows-x64
          path: ${{ runner.temp }}/AI-Agent-Desktop GUI candidate
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload verified distributable bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: cc-connect-v1.4.1-patchset0.1-fc315d2-windows-amd64
          path: |
            ${{ runner.temp }}/cc-connect artifact one (ci)/cc-connect.exe
            ${{ runner.temp }}/cc-connect artifact one (ci)/cc-connect-artifact-manifest.json
            ${{ runner.temp }}/cc-connect artifact one (ci)/cc-connect.sha256
            ${{ runner.temp }}/cc-connect artifact one (ci)/windows-isolated-acceptance.json
            ${{ runner.temp }}/cc-connect artifact one (ci)/windows-managed-runtime-acceptance.json
            ${{ runner.temp }}/cc-connect artifact one (ci)/windows-credential-manager-acceptance.json
            ${{ runner.temp }}/cc-connect artifact one (ci)/windows-native-runtime-acceptance.json
            ${{ runner.temp }}/cc-connect artifact one (ci)/windows10-user-acceptance-wrapper.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
